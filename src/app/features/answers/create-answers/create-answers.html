<section class="create-survey__add-answers">

        <div class="create-survey__answer-row">
            <span class="create-survey_answerIndex">A.</span>
            <input type="text" class="survey__input--medium-width survey__input-field">
            <app-delete-button></app-delete-button>
        </div>
        <p class="error_message">
            This field cannot be empty!
        </p>
    </div>
    <div class="create-survey__answer">
        <div class="create-survey__answer-row">
            <span class="create-survey_answerIndex">B.</span>
