<div class="landing-page-container">
    <header class="landing-page-header">
        <img src="assets/images/logos/logo_orange.png" alt="logo_pollApp_orange">
    </header>
    <main class="landing-page__main">
        <!-- HERO SECTION -->
        <section class="landing-page__hero">
            <div class="landing-page__hero-container-left">
                <h1 class="land-page__hero_title">Collect Feedback, <br> Unlock Ideas</h1>
                <p class="landing-page__hero_subtitle">
                    Create and share surveys in minutes – from team events to workplace culture. Collect opinions,
                    engage your audience, and turn feedback into action.
                </p>
                <button class="btn btn--primary btn--icon-add">
                    New survey
                </button>
            </div>
            <div class="landing-page__hero-container-right">
                <div class="landing-page__hero-visual">
                    <img class="landing-page__hero-visual-image" src="assets/images/ui/hero_img_phone.png" alt="">
                    <img class="landing-page__hero-visual-icon landing-page__hero-visual-icon--bubble"
                        src="assets/images/ui/hero_icon_typing bubble.svg" alt="">
                    <img class="landing-page__hero-visual-icon landing-page__hero-visual-icon--question"
                        src="assets/images/ui/hero_icon_question mark.svg" alt="">
                    <img class="landing-page__hero-visual-icon landing-page__hero-visual-icon--star"
                        src="assets/images/ui/hero_icon_star.svg" alt="">
                    <img class="landing-page__hero-visual-icon landing-page__hero-visual-icon--check"
                        src="assets/images/ui/hero_icon_check.svg" alt="">
                </div>
            </div>
        </section>

        <!-- SURVEYS ENDING SECTION -->
        <section class="landing-page__surveys-ending content-spacing-container section-spacing">
            <h2 class="landing-page__section-title">Your surveys</h2>
            <h3 class="landing-page__section-subtitle">Ending soon surveys</h3>
            <!-- SURVEYS -->
            <app-survey-list></app-survey-list>
        </section>

        <!-- ACTIVE / PAST SURVEYS COLLECTION -->
        <section class="landing-page__surveys-collection content-spacing-container section-spacing">
            <div class="landing-page__surveys-collection-filter">
                <div class="landing-page__surveys-collection-filter-left">
                    <button 
                        class="btn-filter"
                        [class.btn-filter-active] = "activeFilter === 'active'"
                        [class.btn-filter-inactive] = "activeFilter !== 'active'"
                        (click)="activeFilter = 'active'">
                        Active surveys
                    </button>
                    <button 
                        class="btn-filter"
                        class="btn-filter"
                        [class.btn-filter-active] = "activeFilter === 'past'"
                        [class.btn-filter-inactive] = "activeFilter !== 'past'"
                        (click)="activeFilter = 'past'">
                        Past surveys
                    </button>
                </div>
                <div class="landing-page__surveys-collection-filter-right">
                <!-- Drop Down -->
                </div>
            </div>
        </section>
    </main>
</div>
